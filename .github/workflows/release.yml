name: release
run-name: Release by @${{ github.actor }} from ${{ github.ref_name }}

on: push

jobs:
  release:
    uses: nextmv-io/release/.github/workflows/release.yml@feature/eng-6131-design-for-nextpipe-and-others-release-changes
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: nextpipe
      LANGUAGE: python
      PACKAGE_NAME: nextpipe
      PACKAGE_LOCATION: .
      VERSION_FILE: __about__.py
    secrets: inherit

  publish: # Unfortunately, PyPI publishing does not support reusable workflows, so we must publish here.
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_NEEDED: ${{ needs.release.outputs.RELEASE_NEEDED }}
    environment:
      name: pypi
      url: https://pypi.org/p/nextpipe
    steps:
      - name: git clone ${{ github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: set up Python
        uses: actions/setup-python@v5

      - name: python - build binary wheel and source tarball
        if: ${{ env.RELEASE_NEEDED == 'true' }}
        run: python -m build

      - name: python - publish package distributions to PyPI
        if: ${{ env.RELEASE_NEEDED == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist

  notify:
    needs: [release, publish]
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@feature/eng-6131-design-for-nextpipe-and-others-release-changes
    with:
      PACKAGE_NAME: nextpipe
      VERSION: ${{ needs.release.outputs.VERSION }}
      REPOSITORY: nextpipe
    secrets: inherit
