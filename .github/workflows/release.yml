name: release
run-name: Release by @${{ github.actor }} from ${{ github.ref_name }}

on: [push]

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.ref_type == 'branch' }}
    uses: nextmv-io/release/.github/workflows/release.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    permissions:
      contents: write
      pull-requests: write
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: nextpipe
      LANGUAGE: python
      PACKAGE_NAME: nextpipe
      PACKAGE_LOCATION: .
      VERSION_FILE: __about__.py
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
      NEXTMVBOT_SSH_KEY: ${{ secrets.NEXTMVBOT_SSH_KEY }}
      NEXTMVBOT_SIGNING_KEY: ${{ secrets.NEXTMVBOT_SIGNING_KEY }}

  publish: # Unfortunately, PyPI publishing does not support reusable workflows, so we must publish here.
    needs: release
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nextpipe
    permissions:
      id-token: write # This is required for trusted publishing to PyPI
    steps:
      - name: git clone ${{ github.ref_name }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install build hatch

      - name: python - build binary wheel and source tarball
        run: python -m build

      - name: python - publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ./dist

  notify:
    needs: [release, publish]
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' && needs.release.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@949cbb3b90ab294f8da42cf9c314637deaa578f5 # develop
    with:
      PACKAGE_NAME: nextpipe
      VERSION: ${{ needs.release.outputs.VERSION }}
      REPOSITORY: nextpipe
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
